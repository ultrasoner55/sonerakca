<style>
  /* --- SCROLLBAR --- */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; border: 2px solid #000; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }

  html { scroll-behavior: smooth; overflow-x: hidden; }
  body, h1,h2,h3,h4,h5,h6 { font-family: "Montserrat", sans-serif; }

  body {
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('background.png') fixed center/cover #000;
    color: #ccc;
    margin: 0;
  }

  /* --- TAMAMEN SIFIRLANMIŞ DİL BUTONU --- */
  .lang-switch {
    position: fixed;
    top: 25px;
    right: 25px;
    z-index: 2000;
    
    /* Görünüm Sıfırlama */
    background: none !important;
    background-color: transparent !important;
    border: none !important;
    border-width: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
    box-shadow: none !important;
    outline: none !important;
    
    /* Metin Stili */
    color: #fff !important;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    text-transform: uppercase;
    
    /* Tıklama Efektlerini Kapatma */
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent !important;
    user-select: none;
  }

  /* Tıklama anında veya sonrasında oluşabilecek tüm efektleri engelle */
  .lang-switch:focus, 
  .lang-switch:active, 
  .lang-switch:focus-visible,
  .lang-switch:focus-within {
    outline: none !important;
    border: none !important;
    background: transparent !important;
    box-shadow: none !important;
    -webkit-box-shadow: none !important;
  }

  .lang-switch:hover { color: #aaa !important; }

  /* SIDEBAR & SEKMELER */
  .w3-sidebar { width: 120px; background: rgba(20, 20, 20, 0.95); position: fixed; height: 100%; z-index: 1; }
  .w3-sidebar a.w3-bar-item { color: #fff !important; text-decoration: none; transition: 0.3s; }
  .w3-sidebar a.w3-bar-item:hover { background-color: transparent !important; color: #9e9e9e !important; }
  .w3-black { background-color: #000 !important; color: #fff !important; }

  #main { margin-left: 120px; }
  .section-content { padding: 100px 80px; max-width: 1100px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }

  /* SOSYAL MEDYA */
  .social-icons { margin: 25px 0; display: flex; align-items: center; }
  .social-icons a { text-decoration: none !important; color: #fff !important; margin-right: 8px; transition: 0.3s; display: inline-block; }
  .social-icons a:hover { transform: translateY(-3px); color: #9e9e9e !important; }
  .social-icons i { font-size: 24px !important; width: 35px; text-align: center; }

  /* MOBİL UYUM */
  #mobile-nav { display: none; position: fixed; top: 0; width: 100%; z-index: 999; background: #111; justify-content: space-around; }
  #mobile-nav a { padding: 15px 0; text-align: center; width: 33.33%; text-decoration: none; color: white !important; font-size: 11px; font-weight: bold; }

  @media only screen and (max-width: 600px) {
    .w3-sidebar { display: none !important; }
    #mobile-nav { display: flex !important; }
    #main { margin-left: 0 !important; }
    .section-content { padding: 80px 20px; }
    .w3-jumbo { font-size: 32px !important; text-align: center; }
    .lang-switch { top: 18px; right: 15px; z-index: 1000; }
  }
</style>
