        #mobile-nav { display: none; position: fixed; top: 0; width: 100%; z-index: 999; background: #222; }
        #mobile-nav a { flex: 1; text-align: center; padding: 15px; color: white; text-decoration: none; font-size: 12px; }

        @media only screen and (max-width: 600px) {
            .w3-sidebar { display: none !important; }

            #main { margin-left: 0 !important; }
            .section-content { padding: 80px 20px; }
